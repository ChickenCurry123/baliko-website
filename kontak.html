<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontak | Baliko Herbal Healthy Food</title>
<meta name="description" content="Hubungi Baliko lewat email, WhatsApp, atau Facebook.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kontak">
<div id="site-header"></div>
<main>
<section class="wrap ph">
  <h1>Hubungi kami</h1>
  <p>Mau pesan, tanya produk, atau jadi reseller? Kami senang mendengar kabarmu.</p>
</section>

<section class="wrap" style="padding-bottom:clamp(3rem,7vw,6rem)">
  <div class="rows">
    <div class="row" data-rv><span>WhatsApp</span><a data-wa href="#" target="_blank" rel="noopener">Chat sekarang</a></div>
    <div class="row" data-rv><span>Email</span><a href="mailto:halo@baliko.id">halo@baliko.id</a></div>
    <div class="row" data-rv><span>Facebook</span><a href="https://www.facebook.com/" target="_blank" rel="noopener">facebook.com/baliko</a></div>
    <div class="row" data-rv><span>Alamat</span><p>Bekasi, Jawa Barat</p></div>
  </div>
</section>

<section class="sec" style="background:var(--mist)">
  <div class="wrap two">
    <div><h2>Kirim pesan</h2><p class="muted" style="margin-top:1rem;max-width:30ch">Pesanmu akan terbuka di aplikasi email kamu, lalu tinggal dikirim.</p></div>
    <form id="contact-form">
      <label>Nama<input name="nama" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Pesan<textarea name="pesan" required></textarea></label>
      <button class="btn" type="submit">Kirim pesan</button>
    </form>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sh"><h2>Lokasi</h2><a class="link" href="https://www.google.com/maps/search/?api=1&query=Bekasi%2C+Jawa+Barat" target="_blank" rel="noopener">Buka di Google Maps</a></div>
    <div class="map" data-rv>
      <iframe title="Peta lokasi Baliko di Bekasi" src="https://www.google.com/maps?q=Bekasi,+Jawa+Barat&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/animations.js"></script>
</body>
</html>
